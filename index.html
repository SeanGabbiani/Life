<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Life</title>

  <!-- PWA hooks (won’t hurt if files aren’t present yet) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0f16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    :root{
      --bg:#0b0f16;
      --bg2:#070a10;
      --fg:#e9eef7;
      --muted:rgba(233,238,247,.65);
      --glass:rgba(255,255,255,.06);
      --glass2:rgba(255,255,255,.10);
      --stroke:rgba(255,255,255,.05);
      --grid:rgba(255,255,255,.03);

      /* bio-tech cell palette */
      --cellA:#fdfdff;
      --cellB:#d4f0ff;
      --cellC:#7fd6ff;

      --danger:#ef5350;
      --r:14px;
      --shadow:0 10px 30px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{height:100%; margin:0; background:radial-gradient(circle at top, #121828 0, var(--bg2) 55%); color:var(--fg);
      font-family: ui-sans-serif, -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial; overflow:hidden;}
    #app{position:fixed; inset:0; display:flex; flex-direction:column;}

    /* One-line top toolbar */
    .toolbar{
      display:flex;
      flex-wrap:nowrap;
      align-items:center;
      justify-content:center;
      gap:.45rem;
      padding:.45rem .6rem;
      background:rgba(10,12,18,.75);
      border-bottom:1px solid var(--stroke);
      backdrop-filter: blur(16px) saturate(120%);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      user-select:none;
    }
    .toolbar > *{flex:0 0 auto;}
    .group{display:inline-flex; align-items:center; gap:.25rem; padding:.2rem .25rem; border-radius:999px; background:rgba(255,255,255,.03);}
    .btn{
      height:40px;
      padding:0 .75rem;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.07);
      color:var(--fg);
      font-weight:650;
      font-size:.85rem;
      letter-spacing:.2px;
      cursor:pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
      white-space:nowrap;
    }
    .btn:active{transform: translateY(1px);}
    .btn.primary{background:linear-gradient(120deg, rgba(127,214,255,.25), rgba(255,255,255,.06)); border-color:rgba(127,214,255,.35);}
    .btn.danger{background:linear-gradient(120deg, rgba(239,83,80,.55), rgba(255,255,255,.05)); border-color:rgba(239,83,80,.45);}
    .btn.active{outline:2px solid rgba(127,214,255,.35);}

    .label{font-size:.7rem; color:var(--muted); margin-right:.25rem; min-width:38px; text-align:right;}
    input[type="range"]{width:140px;}
    @media (max-width:820px){
      .btn{height:38px; padding:0 .6rem; font-size:.8rem;}
      input[type="range"]{width:110px;}
      .label{display:none;}
      .toolbar{gap:.3rem;}
    }

    /* Canvas */
    #stage{position:relative; flex:1; overflow:hidden;}
    canvas{display:block; width:100%; height:100%; touch-action:none; background:transparent;}

    /* Bestiary modal */
    .modal{
      position:fixed; inset:0;
      background:rgba(0,0,0,.45);
      backdrop-filter: blur(2px);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:999;
    }
    .modal.show{display:flex;}
    .sheet{
      width:min(760px, 96vw);
      max-height:78vh;
      background:rgba(12,14,20,.82);
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px 16px 0 0;
      box-shadow: var(--shadow);
      overflow:auto;
      padding:12px;
    }
    .sheetHead{
      display:flex; gap:8px; align-items:center;
      position:sticky; top:0;
      background:inherit;
      padding-bottom:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      margin-bottom:10px;
    }
    .sheetHead .title{font-weight:750; letter-spacing:.08em; text-transform:uppercase; font-size:.8rem; opacity:.85; margin-right:auto;}
    .chip{
      height:34px; padding:0 .65rem; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:var(--fg);
      font-weight:650; font-size:.78rem;
    }
    .sectionTitle{font-size:.72rem; opacity:.7; text-transform:uppercase; letter-spacing:.08em; margin:10px 0 6px;}
    .grid{display:flex; flex-wrap:wrap; gap:8px;}
    .grid button{
      height:34px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:var(--fg);
      font-weight:650;
      font-size:.78rem;
      padding:0 .7rem;
      cursor:pointer;
    }
    .note{font-size:.78rem; color:rgba(233,238,247,.65); line-height:1.25; margin-top:10px;}
  </style>
</head>

<body>
<div id="app">
  <!-- TOP TOOLBAR -->
  <div class="toolbar" id="toolbar">
    <button class="btn primary" id="runBtn"><span id="runLabel">Run</span></button>
    <button class="btn" id="randomBtn">Random</button>
    <button class="btn danger" id="clearBtn">Clear</button>

    <div class="group">
      <button class="btn active" id="toolPaint">Paint</button>
      <button class="btn" id="toolErase">Erase</button>
      <button class="btn" id="toolStamp">Stamp</button>
    </div>

    <div class="group">
      <span class="label">Speed</span>
      <input id="speedSlider" type="range" min="2" max="60" value="20" />
    </div>

    <div class="group">
      <span class="label">Cell</span>
      <input id="cellSizeSlider" type="range" min="4" max="24" value="10" />
    </div>

    <button class="btn" id="bestiaryBtn">Bestiary</button>
  </div>

  <!-- CANVAS -->
  <div id="stage">
    <canvas id="life"></canvas>
  </div>
</div>

<!-- BESTIARY -->
<div class="modal" id="bestiaryModal" aria-hidden="true">
  <div class="sheet">
    <div class="sheetHead">
      <div class="title">Bestiary</div>
      <button class="chip" id="closeBestiary">Close</button>
    </div>

    <div class="sectionTitle">Gliders</div>
    <div class="grid">
      <button data-stamp="gliderSE">Glider SE</button>
      <button data-stamp="gliderNE">Glider NE</button>
      <button data-stamp="gliderNW">Glider NW</button>
      <button data-stamp="gliderSW">Glider SW</button>
    </div>

    <div class="sectionTitle">Spaceships</div>
    <div class="grid">
      <button data-stamp="lwss">LWSS</button>
    </div>

    <div class="sectionTitle">Methuselahs</div>
    <div class="grid">
      <button data-stamp="rpent">R-pentomino</button>
    </div>

    <div class="sectionTitle">Guns</div>
    <div class="grid">
      <button data-stamp="gosperE">Gosper →</button>
      <button data-stamp="gosperW">Gosper ←</button>
      <button data-stamp="gosperN">Gosper ↑</button>
      <button data-stamp="gosperS">Gosper ↓</button>
    </div>

    <div class="sectionTitle">Cathedrals</div>
    <div class="grid">
      <button data-stamp="miniHyperDeath">Mini Hyper-Death</button>
    </div>

    <div class="note">
      Tip: choose a beast, then tap the universe to stamp. “Mini Hyper-Death” disables edge wrapping so it can expand outward.
      Clear or Random re-enables wrapping.
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- DOM ----------
  const canvas = document.getElementById('life');
  const ctx = canvas.getContext('2d', { alpha: false });

  const runBtn = document.getElementById('runBtn');
  const runLabel = document.getElementById('runLabel');
  const randomBtn = document.getElementById('randomBtn');
  const clearBtn = document.getElementById('clearBtn');

  const toolPaint = document.getElementById('toolPaint');
  const toolErase = document.getElementById('toolErase');
  const toolStamp = document.getElementById('toolStamp');

  const speedSlider = document.getElementById('speedSlider');
  const cellSizeSlider = document.getElementById('cellSizeSlider');

  const bestiaryBtn = document.getElementById('bestiaryBtn');
  const bestiaryModal = document.getElementById('bestiaryModal');
  const closeBestiary = document.getElementById('closeBestiary');

  // ---------- State ----------
  let DPR = Math.max(1, window.devicePixelRatio || 1);
  let cellSize = parseInt(cellSizeSlider.value, 10);
  let cols = 0, rows = 0;
  let grid = new Uint8Array(0);
  let next = new Uint8Array(0);

  let running = false;
  let fps = parseInt(speedSlider.value, 10);
  let acc = 0;
  let last = performance.now();

  let tool = 'paint'; // paint | erase | stamp
  let currentStamp = null;
  let wrapEdges = true;

  // ---------- Helpers ----------
  const idx = (x, y) => y * cols + x;
  const wrap = (x, y) => ((y + rows) % rows) * cols + ((x + cols) % cols);

  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    const rect = canvas.getBoundingClientRect();
    const w = Math.floor(rect.width * DPR);
    const h = Math.floor(rect.height * DPR);

    canvas.width = w;
    canvas.height = h;

    cols = Math.max(8, Math.floor(w / (cellSize * DPR)));
    rows = Math.max(8, Math.floor(h / (cellSize * DPR)));

    grid = new Uint8Array(cols * rows);
    next = new Uint8Array(cols * rows);

    draw();
  }

  function randomize(density = 0.18) {
    for (let i = 0; i < grid.length; i++) grid[i] = Math.random() < density ? 1 : 0;
    wrapEdges = true;
    draw();
  }

  function clearAll() {
    grid.fill(0);
    wrapEdges = true;
    draw();
  }

  function step() {
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        let n = 0;
        if (wrapEdges) {
          n += grid[wrap(x-1,y-1)] + grid[wrap(x,y-1)] + grid[wrap(x+1,y-1)];
          n += grid[wrap(x-1,y  )]                + grid[wrap(x+1,y  )];
          n += grid[wrap(x-1,y+1)] + grid[wrap(x,y+1)] + grid[wrap(x+1,y+1)];
        } else {
          const get = (xx,yy) => (xx<0||yy<0||xx>=cols||yy>=rows) ? 0 : grid[idx(xx,yy)];
          n += get(x-1,y-1) + get(x,y-1) + get(x+1,y-1);
          n += get(x-1,y  )            + get(x+1,y  );
          n += get(x-1,y+1) + get(x,y+1) + get(x+1,y+1);
        }

        const i = idx(x,y);
        const g = grid[i];
        next[i] = (g ? (n===2 || n===3) : (n===3)) ? 1 : 0;
      }
    }
    const t = grid; grid = next; next = t;
  }

  function draw() {
    // background
    ctx.fillStyle = '#0b0f16';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const scale = cellSize * DPR;

    // grid lines
    if (scale >= 8) {
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x <= cols; x++) {
        const px = x * scale + 0.5;
        ctx.moveTo(px, 0); ctx.lineTo(px, canvas.height);
      }
      for (let y = 0; y <= rows; y++) {
        const py = y * scale + 0.5;
        ctx.moveTo(0, py); ctx.lineTo(canvas.width, py);
      }
      ctx.stroke();
    }

    // cells (soft bio-tech glow)
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        if (!grid[idx(x,y)]) continue;

        const px = x * scale;
        const py = y * scale;
        const pad = Math.max(1, Math.floor(scale * 0.12));
        const s = Math.max(1, Math.floor(scale) - pad * 2);

        const cx = px + pad + s/2;
        const cy = py + pad + s/2;
        const r = s * 0.8;

        const g = ctx.createRadialGradient(cx, cy, r * 0.12, cx, cy, r);
        g.addColorStop(0,  '#fdfdff');
        g.addColorStop(0.6,'#d4f0ff');
        g.addColorStop(1,  '#7fd6ff');

        ctx.fillStyle = g;
        ctx.fillRect(px + pad, py + pad, s, s);
      }
    }
  }

  function screenToCell(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    const x = (clientX - r.left) * DPR;
    const y = (clientY - r.top) * DPR;
    const cx = Math.floor(x / (cellSize * DPR));
    const cy = Math.floor(y / (cellSize * DPR));
    return { cx, cy };
  }

  function setTool(t) {
    tool = t;
    toolPaint.classList.toggle('active', t === 'paint');
    toolErase.classList.toggle('active', t === 'erase');
    toolStamp.classList.toggle('active', t === 'stamp');
  }

  // ---------- Patterns (coords are [x,y] offsets) ----------
  const PAT = {
    // gliders (canonical 3x3 shapes in 4 dirs)
    gliderSE: [[1,0],[2,1],[0,2],[1,2],[2,2]],
    gliderNE: [[0,0],[1,0],[2,0],[0,1],[1,2]],
    gliderNW: [[0,0],[1,0],[2,0],[2,1],[1,2]],
    gliderSW: [[1,0],[0,1],[0,2],[1,2],[2,2]],

    rpent: [[0,1],[1,0],[1,1],[1,2],[2,1]],

    // LWSS (canonical)
    lwss: [
      [0,0],[3,0],
      [4,1],
      [0,2],[4,2],
      [1,3],[2,3],[3,3],[4,3]
    ],

    // Gosper gun base (east)
    gosperE: [
      [5,1],[6,1],[5,2],[6,2],
      [5,11],[6,11],[7,11],[4,12],[8,12],[3,13],[9,13],[3,14],[9,14],[6,15],[4,16],[8,16],[5,17],[6,17],[7,17],[6,18],
      [3,21],[4,21],[5,21],[3,22],[4,22],[5,22],[2,23],[6,23],
      [1,25],[2,25],[6,25],[7,25],
      [3,35],[4,35],[3,36],[4,36]
    ],
  };

  function rotate90(coords) { // (x,y)->(y,-x)
    let out = coords.map(([x,y]) => [y, -x]);
    // normalize to 0+
    let minX=Infinity, minY=Infinity;
    for (const [x,y] of out){ if(x<minX)minX=x; if(y<minY)minY=y; }
    return out.map(([x,y]) => [x-minX, y-minY]);
  }

  function rotate(coords, times) {
    let c = coords;
    const t = ((times%4)+4)%4;
    for (let i=0;i<t;i++) c = rotate90(c);
    return c;
  }

  function getStamp(name) {
    if (name === 'gosperN') return rotate(PAT.gosperE, 1);
    if (name === 'gosperW') return rotate(PAT.gosperE, 2);
    if (name === 'gosperS') return rotate(PAT.gosperE, 3);
    if (name === 'miniHyperDeath') {
      // 4 guns around a center point
      const E = PAT.gosperE;
      const N = rotate(PAT.gosperE,1);
      const W = rotate(PAT.gosperE,2);
      const S = rotate(PAT.gosperE,3);
      const out = [];
      for (const [x,y] of E) out.push([x-20,y]);
      for (const [x,y] of W) out.push([x+20,y]);
      for (const [x,y] of N) out.push([x,y+20]);
      for (const [x,y] of S) out.push([x,y-20]);
      return out;
    }
    return PAT[name] || null;
  }

  function stampAtCell(name, cx, cy) {
    const coords = getStamp(name);
    if (!coords) return;

    if (name === 'miniHyperDeath') {
      wrapEdges = false;
      cx = Math.floor(cols/2);
      cy = Math.floor(rows/2);
    }

    // center stamp bounding box on (cx,cy)
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for (const [x,y] of coords){ if(x<minX)minX=x; if(y<minY)minY=y; if(x>maxX)maxX=x; if(y>maxY)maxY=y; }
    const w = maxX-minX+1, h=maxY-minY+1;
    const ox = cx - Math.floor(w/2) - minX;
    const oy = cy - Math.floor(h/2) - minY;

    for (const [x,y] of coords) {
      const xx = ox + x;
      const yy = oy + y;
      if (wrapEdges) {
        grid[wrap(xx,yy)] = 1;
      } else {
        if (xx<0||yy<0||xx>=cols||yy>=rows) continue;
        grid[idx(xx,yy)] = 1;
      }
    }
    draw();
  }

  // ---------- Input ----------
  let pointerDown = false;

  canvas.addEventListener('pointerdown', (e) => {
    pointerDown = true;
    const {cx,cy} = screenToCell(e.clientX, e.clientY);

    if (tool === 'stamp' && currentStamp) {
      stampAtCell(currentStamp, cx, cy);
      return;
    }

    if (cx<0||cy<0||cx>=cols||cy>=rows) return;
    if (tool === 'paint') grid[idx(cx,cy)] = 1;
    if (tool === 'erase') grid[idx(cx,cy)] = 0;
    draw();
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!pointerDown) return;
    if (tool === 'stamp') return; // stamp is click-only
    const {cx,cy} = screenToCell(e.clientX, e.clientY);
    if (cx<0||cy<0||cx>=cols||cy>=rows) return;
    if (tool === 'paint') grid[idx(cx,cy)] = 1;
    if (tool === 'erase') grid[idx(cx,cy)] = 0;
    draw();
  });

  window.addEventListener('pointerup', () => { pointerDown = false; });

  // ---------- UI wiring ----------
  runBtn.addEventListener('click', () => {
    running = !running;
    runLabel.textContent = running ? 'Pause' : 'Run';
  });

  randomBtn.addEventListener('click', () => {
    running = false;
    runLabel.textContent = 'Run';
    randomize(0.18);
  });

  clearBtn.addEventListener('click', () => {
    running = false;
    runLabel.textContent = 'Run';
    clearAll();
  });

  toolPaint.addEventListener('click', () => { setTool('paint'); currentStamp = null; });
  toolErase.addEventListener('click', () => { setTool('erase'); currentStamp = null; });
  toolStamp.addEventListener('click', () => { setTool('stamp'); });

  speedSlider.addEventListener('input', () => { fps = parseInt(speedSlider.value, 10); });
  cellSizeSlider.addEventListener('input', () => {
    cellSize = parseInt(cellSizeSlider.value, 10);
    resize();
  });

  bestiaryBtn.addEventListener('click', () => {
    bestiaryModal.classList.add('show');
    bestiaryModal.setAttribute('aria-hidden', 'false');
  });

  closeBestiary.addEventListener('click', () => {
    bestiaryModal.classList.remove('show');
    bestiaryModal.setAttribute('aria-hidden', 'true');
  });

  bestiaryModal.addEventListener('click', (e) => {
    if (e.target === bestiaryModal) {
      bestiaryModal.classList.remove('show');
      bestiaryModal.setAttribute('aria-hidden', 'true');
    }
  });

  // Bestiary pattern selection
  bestiaryModal.querySelectorAll('[data-stamp]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentStamp = btn.getAttribute('data-stamp');
      setTool('stamp');
      bestiaryModal.classList.remove('show');
      bestiaryModal.setAttribute('aria-hidden', 'true');
    });
  });

  // ---------- Main loop ----------
  function frame(ts) {
    const dt = (ts - last) / 1000;
    last = ts;
    acc += dt;

    const stepT = 1 / Math.max(2, fps);

    if (running) {
      while (acc >= stepT) {
        step();
        acc -= stepT;
      }
      draw();
    }

    requestAnimationFrame(frame);
  }

  // ---------- Boot ----------
  function boot() {
    resize();
    clearAll();
    requestAnimationFrame(frame);

    // Service worker registration (safe)
    const APP_VERSION = "v1";
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=' + APP_VERSION).catch(()=>{});
      });
    }
  }

  window.addEventListener('resize', resize);
  boot();
})();
</script>
</body>
</html>
